<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10">
<style>
.rb{animation:hue 7s linear infinite}
.glowrb{animation:hue 7s linear infinite;opacity:.5}
@keyframes hue{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
</style>
<defs>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#ff004c"/><stop offset=".17" stop-color="#ff9900"/>
<stop offset=".33" stop-color="#ffee00"/><stop offset=".5" stop-color="#00ff85"/>
<stop offset=".67" stop-color="#00cfff"/><stop offset=".83" stop-color="#8a2be2"/>
<stop offset="1" stop-color="#ff00c8"/>
</linearGradient>
<filter id="bg" x="0" y="-500%" width="100%" height="1100%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<rect class="glowrb" x="0" y="2" width="1200" height="6" fill="url(#r)" filter="url(#bg)"/>
<rect class="rb" x="0" y="4.2" width="1200" height="1.8" rx="1" fill="url(#r)"/>
</svg>