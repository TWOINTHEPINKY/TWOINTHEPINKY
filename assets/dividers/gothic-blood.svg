<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 26" width="1200" height="26">
<!-- 🧛 ГОТИЧЕСКИЙ КРОВАВЫЙ РАЗДЕЛИТЕЛЬ: линия-кровь, стекающие капли,
     две летучие мыши и пульсирующая кровавая луна в центре.
     Цвета крови меняются заменой: #e60000 (яркий), #7a0000 (тёмный), #b30000 (капли) -->
<style>
.lineglow{animation:lg 4s ease-in-out infinite}
@keyframes lg{0%,100%{opacity:.4}50%{opacity:.85}}

.moon{transform-box:fill-box;transform-origin:center;animation:moonPulse 3s ease-in-out infinite}
@keyframes moonPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.moonglow{animation:mg 3s ease-in-out infinite}
@keyframes mg{0%,100%{opacity:.12}50%{opacity:.3}}

.drip{transform-box:fill-box;transform-origin:50% 0;animation:dripGrow 2.8s ease-in-out infinite}
@keyframes dripGrow{0%,100%{transform:scaleY(.8)}55%{transform:scaleY(1.22)}}

.drop{animation:fall 2.8s linear infinite}
@keyframes fall{0%{transform:translateY(0);opacity:0}12%{opacity:1}75%{opacity:1}100%{transform:translateY(9px);opacity:0}}

.fly1{animation:flyX 12s linear infinite}
.fly2{animation:flyX 18s linear -7s infinite}
@keyframes flyX{from{transform:translateX(-80px)}to{transform:translateX(1280px)}}

.bob{animation:bob 1.7s ease-in-out infinite alternate}
.bob2{animation:bob 2.3s ease-in-out infinite alternate-reverse}
@keyframes bob{from{transform:translateY(-2.5px)}to{transform:translateY(2.5px)}}

.wl{transform-box:fill-box;transform-origin:100% 65%;animation:flapL .38s ease-in-out infinite}
.wr{transform-box:fill-box;transform-origin:0% 65%;animation:flapR .38s ease-in-out infinite}
@keyframes flapL{0%,100%{transform:rotate(15deg)}50%{transform:rotate(-18deg)}}
@keyframes flapR{0%,100%{transform:rotate(-15deg)}50%{transform:rotate(18deg)}}
</style>
<defs>
<linearGradient id="bl" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#1f0000" stop-opacity=".35"/>
<stop offset=".18" stop-color="#5c0000"/>
<stop offset=".5" stop-color="#e60000"/>
<stop offset=".82" stop-color="#5c0000"/>
<stop offset="1" stop-color="#1f0000" stop-opacity=".35"/>
</linearGradient>
<radialGradient id="mn">
<stop offset="0" stop-color="#ff5544"/>
<stop offset=".7" stop-color="#c40000"/>
<stop offset="1" stop-color="#5c0000"/>
</radialGradient>
<filter id="gl" x="-50%" y="-400%" width="200%" height="900%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>

<!-- линия крови + свечение -->
<rect class="lineglow" x="0" y="5.6" width="1200" height="5" fill="url(#bl)" filter="url(#gl)"/>
<rect x="0" y="7" width="1200" height="2.4" rx="1.2" fill="url(#bl)"/>

<!-- кровавая луна -->
<circle class="moonglow" cx="600" cy="8.2" r="11" fill="#ff0000" filter="url(#gl)"/>
<circle class="moon" cx="600" cy="8.2" r="6" fill="url(#mn)"/>

<!-- стекающие капли (8 штук, у каждой свой ритм) -->
<g fill="#b30000">
<path class="drip" style="animation-delay:0s"    d="M90,9 C92,12.5 92,15.5 90,18 C88,15.5 88,12.5 90,9 Z"/>
<path class="drip" style="animation-delay:.7s"   d="M240,9 C242,12 242,14.5 240,16.5 C238,14.5 238,12 240,9 Z"/>
<path class="drip" style="animation-delay:1.4s"  d="M370,9 C372,13 372,16 370,18.5 C368,16 368,13 370,9 Z"/>
<path class="drip" style="animation-delay:2.1s"  d="M520,9 C522,12 522,14.5 520,16.5 C518,14.5 518,12 520,9 Z"/>
<path class="drip" style="animation-delay:.35s"  d="M700,9 C702,12.5 702,15.5 700,18 C698,15.5 698,12.5 700,9 Z"/>
<path class="drip" style="animation-delay:1.75s" d="M830,9 C832,12 832,14.5 830,16.5 C828,14.5 828,12 830,9 Z"/>
<path class="drip" style="animation-delay:1.05s" d="M960,9 C962,13 962,16 960,18.5 C958,16 958,13 960,9 Z"/>
<path class="drip" style="animation-delay:2.45s" d="M1110,9 C1112,12 1112,14.5 1110,16.5 C1108,14.5 1108,12 1110,9 Z"/>
</g>
<!-- падающие капли -->
<g fill="#c10000">
<circle class="drop" style="animation-delay:.4s"   cx="90"   cy="18" r="1.5"/>
<circle class="drop" style="animation-delay:1.1s"  cx="240"  cy="16" r="1.3"/>
<circle class="drop" style="animation-delay:1.8s"  cx="370"  cy="18" r="1.5"/>
<circle class="drop" style="animation-delay:2.5s"  cx="520"  cy="16" r="1.3"/>
<circle class="drop" style="animation-delay:.75s"  cx="700"  cy="18" r="1.5"/>
<circle class="drop" style="animation-delay:2.15s" cx="830"  cy="16" r="1.3"/>
<circle class="drop" style="animation-delay:1.45s" cx="960"  cy="18" r="1.5"/>
<circle class="drop" style="animation-delay:.05s"  cx="1110" cy="16" r="1.3"/>
</g>

<!-- 🦇 летучая мышь №1 (крупная, быстрая) -->
<g class="fly1"><g class="bob"><g transform="translate(0,3)">
<g fill="#140000" stroke="#7a0d0d" stroke-width=".35">
<path class="wl" d="M0,0 C-3,-4 -8,-7 -15,-6 C-12,-3 -13,0 -16,3 C-10,2 -5,3 0,2 Z"/>
<path class="wr" d="M0,0 C3,-4 8,-7 15,-6 C12,-3 13,0 16,3 C10,2 5,3 0,2 Z"/>
<path d="M-1.6,-1.5 L-2.6,-4.6 L-0.2,-2.2 Z"/>
<path d="M1.6,-1.5 L2.6,-4.6 L0.2,-2.2 Z"/>
<ellipse cx="0" cy="1" rx="1.7" ry="3.2"/>
</g>
<circle cx="-0.7" cy="-0.2" r="0.45" fill="#ff2a2a"/>
<circle cx="0.7" cy="-0.2" r="0.45" fill="#ff2a2a"/>
</g></g></g>

<!-- 🦇 летучая мышь №2 (мелкая, медленная) -->
<g class="fly2"><g class="bob2"><g transform="translate(0,15) scale(.6)">
<g fill="#140000" stroke="#7a0d0d" stroke-width=".5">
<path class="wl" d="M0,0 C-3,-4 -8,-7 -15,-6 C-12,-3 -13,0 -16,3 C-10,2 -5,3 0,2 Z"/>
<path class="wr" d="M0,0 C3,-4 8,-7 15,-6 C12,-3 13,0 16,3 C10,2 5,3 0,2 Z"/>
<path d="M-1.6,-1.5 L-2.6,-4.6 L-0.2,-2.2 Z"/>
<path d="M1.6,-1.5 L2.6,-4.6 L0.2,-2.2 Z"/>
<ellipse cx="0" cy="1" rx="1.7" ry="3.2"/>
</g>
<circle cx="-0.7" cy="-0.2" r="0.45" fill="#ff2a2a"/>
<circle cx="0.7" cy="-0.2" r="0.45" fill="#ff2a2a"/>
</g></g></g>
</svg>
