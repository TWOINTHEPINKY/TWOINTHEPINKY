<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<title>html5</title>
<defs><radialGradient id="glow"><stop offset="0" stop-color="#E34F26" stop-opacity=".6"/><stop offset="1" stop-color="#E34F26" stop-opacity="0"/></radialGradient></defs>
<style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes halo{0%,100%{opacity:.30;transform:scale(1)}50%{opacity:.65;transform:scale(1.1)}}

.halo{animation:halo 2.6s ease-in-out infinite;transform-origin:32px 32px}
.ico{animation:pulse 2.2s ease-in-out infinite;transform-origin:12px 12px}
</style>
<circle class="halo" cx="32" cy="32" r="26" fill="url(#glow)"/>
<g transform="translate(20,20)"><g class="ico"><path d="M1.5 0h21l-1.91 21.563L11.977 24l-8.564-2.438L1.5 0zm7.031 9.75l-.232-2.718 10.059.003.23-2.622L5.412 4.41l.698 8.01h9.126l-.326 3.426-2.91.804-2.955-.81-.188-2.11H6.248l.33 4.171L12 19.351l5.379-1.443.744-8.157H8.531z" fill="#E34F26"/></g></g>
</svg>
