<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<title>gmail</title>
<defs><radialGradient id="glow"><stop offset="0" stop-color="#EA4335" stop-opacity=".6"/><stop offset="1" stop-color="#EA4335" stop-opacity="0"/></radialGradient></defs>
<style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes halo{0%,100%{opacity:.30;transform:scale(1)}50%{opacity:.65;transform:scale(1.1)}}

.halo{animation:halo 2.6s ease-in-out infinite;transform-origin:32px 32px}
.ico{animation:bounce 1.6s cubic-bezier(.28,.84,.42,1) infinite;transform-origin:12px 12px}
</style>
<circle class="halo" cx="32" cy="32" r="26" fill="url(#glow)"/>
<g transform="translate(20,20)"><g class="ico"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g></g>
</svg>
