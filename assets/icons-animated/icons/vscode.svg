<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<title>vscode</title>
<defs><radialGradient id="glow"><stop offset="0" stop-color="#007ACC" stop-opacity=".6"/><stop offset="1" stop-color="#007ACC" stop-opacity="0"/></radialGradient></defs>
<style>
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes halo{0%,100%{opacity:.30;transform:scale(1)}50%{opacity:.65;transform:scale(1.1)}}

.halo{animation:halo 2.6s ease-in-out infinite;transform-origin:32px 32px}
.ico{animation:wiggle 2s ease-in-out infinite;transform-origin:12px 12px}
</style>
<circle class="halo" cx="32" cy="32" r="26" fill="url(#glow)"/>
<g transform="translate(20,20)"><g class="ico"><path d="M23.15 2.587L18.21.21a1.494 1.494 0 0 0-1.705.29l-9.46 8.63-4.12-3.128a.999.999 0 0 0-1.276.057L.327 7.261A1 1 0 0 0 .326 8.74L3.899 12 .326 15.26a1 1 0 0 0 .001 1.479L1.65 17.94a.999.999 0 0 0 1.276.057l4.12-3.128 9.46 8.63a1.492 1.492 0 0 0 1.704.29l4.942-2.377A1.5 1.5 0 0 0 24 20.06V3.939a1.5 1.5 0 0 0-.85-1.352zm-5.146 14.861L10.826 12l7.178-5.448v10.896z" fill="#007ACC"/></g></g>
</svg>
