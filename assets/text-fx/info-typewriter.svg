<animate attributeName="y" values="40.0;40.0;40.0;40.0;64.0;64.0;64.0;88.0;88.0;88.0;112.0;112.0;112.0;136.0;136.0;136.0;160.0;160.0;160.0;192.0;192.0;192.0;192.0" keyTimes="0.0000;0.0291;0.1476;0.1674;0.1680;0.2864;0.3062;0.3068;0.4291;0.4489;0.4495;0.5699;0.5897;0.5903;0.7029;0.7227;0.7233;0.7835;0.8033;0.8039;0.8835;0.9592;1.0000" dur="17.2s" repeatCount="indefinite"/>
