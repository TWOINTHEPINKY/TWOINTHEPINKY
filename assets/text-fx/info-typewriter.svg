<text x="30" y="56" clip-path="url(#c0)"><tspan>I develop absolutely </tspan><tspan font-weight="700" fill="url(#hlGrad)">incredible</tspan><tspan> things—specifically, creative</tspan></text><text x="30" y="80" clip-path="url(#c1)"><tspan>projects. My work covers everything from frontend and backend</tspan></text><text x="30" y="104" clip-path="url(#c2)"><tspan>development to integrating your custom bots and scripts. If you</tspan></text><text x="30" y="128" clip-path="url(#c3)"><tspan>are familiar with my projects—or if something you’ve just seen</tspan></text><text x="30" y="152" clip-path="url(#c4)"><tspan>caught your eye—and you have an idea, please get in touch.</tspan></text><text x="30" y="176" clip-path="url(#c5)"><tspan>Contact me via the links below.</tspan></text><text x="30" y="208" clip-path="url(#c6)"><tspan font-weight="700" fill="url(#hlGrad)">P.S. Pizza, Sprite and MacDonald's lover.</tspan></text>
<rect x="29" y="40" width="2.5" height="18" fill="#00d4ff">
