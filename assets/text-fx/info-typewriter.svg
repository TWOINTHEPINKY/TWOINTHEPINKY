<rect x="14" y="42" width="3" height="136" rx="1.5" fill="url(#accent)" opacity=".75"/>
<g>
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.9529;0.995;1" dur="17.0s" repeatCount="indefinite"/>
<text x="30" y="56" clip-path="url(#c0)"><tspan>I develop absolutely </tspan><tspan font-weight="700" fill="url(#hlGrad)">incredible</tspan><tspan> things—specifically, creative</tspan></text><text x="30" y="80" clip-path="url(#c1)"><tspan>projects. My work covers everything from frontend and backend</tspan></text><text x="30" y="104" clip-path="url(#c2)"><tspan>development to integrating your custom bots and scripts. If you</tspan></text><text x="30" y="128" clip-path="url(#c3)"><tspan>are familiar with my projects—or if something you’ve just seen</tspan></text><text x="30" y="152" clip-path="url(#c4)"><tspan>caught your eye—and you have an idea, please get in touch.</tspan></text><text x="30" y="176" clip-path="url(#c5)"><tspan>Contact me via the links below.</tspan></text>
<rect x="30" y="41" width="2.5" height="17" fill="#00d4ff">
<animate attributeName="x" values="30.0;30.0;494.8;494.8;30.0;494.8;494.8;30.0;510.1;510.1;30.0;502.4;502.4;30.0;472.0;472.0;30.0;266.2;266.2;266.2" keyTimes="0.0000;0.0353;0.1765;0.1935;0.1941;0.3353;0.3524;0.3529;0.4941;0.5112;0.5118;0.6529;0.6700;0.6706;0.8000;0.8171;0.8176;0.8941;0.9529;1.0000" dur="17.0s" repeatCount="indefinite"/>
<animate attributeName="y" values="41.0;41.0;41.0;41.0;65.0;65.0;65.0;89.0;89.0;89.0;113.0;113.0;113.0;137.0;137.0;137.0;161.0;161.0;161.0;161.0" keyTimes="0.0000;0.0353;0.1765;0.1935;0.1941;0.3353;0.3524;0.3529;0.4941;0.5112;0.5118;0.6529;0.6700;0.6706;0.8000;0.8171;0.8176;0.8941;0.9529;1.0000" dur="17.0s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="0.85s" repeatCount="indefinite"/>
